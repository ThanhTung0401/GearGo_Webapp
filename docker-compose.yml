services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: geargo-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=GearGo@123
      - MSSQL_PID=Developer
    ports:
      # Map host:container. Dùng 11433 phía host để tránh đụng SQL Server khác
      # đang nghe 1433 trên máy (local install hoặc container khác).
      - "11433:1433"
    volumes:
      - geargo_db_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  geargo_db_data:
