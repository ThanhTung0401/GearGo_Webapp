services:
  n8n:
    image: n8nio/n8n:latest
    container_name: geargo-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
